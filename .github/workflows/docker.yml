name: Docker

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# automatically cancel in-progress builds if another commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# default to 0 permissions
# (job-level overrides add the minimal permissions needed)
permissions:
  contents: none

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: lint dockerfiles
        run: |
          ./.ci/lint-dockerfiles.sh
  build-cpu:
    name: build (CPU)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: dockerfile-cli (build)
        env:
          LIGHTGBM_GIT_REF: ${{ github.head_ref }}
        run: |
          docker build \
            -t lightgbm:cli \
            --build-arg LIGHTGBM_GIT_REF="${LIGHTGBM_GIT_REF}" \
            --build-arg LIGHTGBM_GIT_URL=https://github.com/${{ github.repository }} \
            - < ./docker/dockerfile-cli
      - name: dockerfile-cli (test)
        run: |
          docker run \
            --entrypoint="" \
            --rm \
            lightgbm:cli \
            which lightgbm
      - name: dockerfile-r (build)
        env:
          LIGHTGBM_GIT_REF: ${{ github.head_ref }}
        run: |
          docker build \
            -t lightgbm:r \
            --build-arg LIGHTGBM_GIT_REF="${LIGHTGBM_GIT_REF}" \
            --build-arg LIGHTGBM_GIT_URL=https://github.com/${{ github.repository }} \
            - < ./docker/dockerfile-r
      - name: dockerfile-r (test)
        run: |
          docker run \
            --rm \
            lightgbm:r \
            Rscript -e "library(lightgbm); print(sessionInfo())"
      - name: dockerfile-python (build)
        env:
          LIGHTGBM_GIT_REF: ${{ github.head_ref }}
        run: |
          docker build \
            -t lightgbm:python \
            --build-arg LIGHTGBM_GIT_REF="${LIGHTGBM_GIT_REF}" \
            --build-arg LIGHTGBM_GIT_URL=https://github.com/${{ github.repository }} \
            - < ./docker/dockerfile-python
      - name: dockerfile-python (test)
        run: |
          docker run \
            --rm \
            lightgbm:python \
            python -c "import lightgbm; print(f'lightgbm version: {lightgbm.__version__}')"
  build-gpu:
    name: build (GPU)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: dockerfile.gpu (build)
        env:
          LIGHTGBM_GIT_REF: ${{ github.head_ref }}
        run: |
          docker build \
            -t lightgbm:gpu \
            --build-arg LIGHTGBM_GIT_REF="${LIGHTGBM_GIT_REF}" \
            --build-arg LIGHTGBM_GIT_URL=https://github.com/${{ github.repository }} \
            - < ./docker/gpu/dockerfile.gpu
      - name: dockerfile.gpu (test)
        run: |
          docker run \
            --entrypoint="" \
            --rm \
            -t lightgbm:gpu \
            python -c "import lightgbm; print(f'lightgbm version: {lightgbm.__version__}')"
      - name: dockerfile-cli-only.gpu (build)
        env:
          LIGHTGBM_GIT_REF: ${{ github.head_ref }}
        run: |
          docker build \
            -t lightgbm:cli-only.gpu \
            --build-arg LIGHTGBM_GIT_REF="${LIGHTGBM_GIT_REF}" \
            --build-arg LIGHTGBM_GIT_URL=https://github.com/${{ github.repository }} \
            - < ./docker/gpu/dockerfile-cli-only.gpu
      - name: dockerfile-cli-only.gpu (test)
        run: |
          docker run \
            --rm \
            -v "${PWD}/examples/binary_classification:/data:ro" \
            -w /data \
            lightgbm:cli-only.gpu \
            config=train.conf \
            num_trees=5 \
            device_type=cpu \
            output_model=/tmp/model.txt
      - name: dockerfile-cli-only-distroless.gpu (build)
        env:
          LIGHTGBM_GIT_REF: ${{ github.head_ref }}
        run: |
          docker build \
            -t lightgbm:cli-only-distroless.gpu \
            --build-arg LIGHTGBM_GIT_REF="${LIGHTGBM_GIT_REF}" \
            --build-arg LIGHTGBM_GIT_URL=https://github.com/${{ github.repository }} \
            - < ./docker/gpu/dockerfile-cli-only-distroless.gpu
      - name: dockerfile-cli-only-distroless.gpu (test)
        run: |
          docker run \
            --rm \
            -v "${PWD}/examples/binary_classification:/data:ro" \
            -w /data \
            lightgbm:cli-only-distroless.gpu \
            config=train.conf \
            num_trees=5 \
            device_type=cpu \
            output_model=/tmp/model.txt
  all-docker-jobs-successful:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - build-cpu
      - build-gpu
      - lint
    permissions:
      statuses: read
    steps:
      - name: Note that all tests succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
