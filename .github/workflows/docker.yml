name: Docker

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      test-on-gpu:
        description: 'Run the GPU image tests on a GPU runner'
        type: boolean
        default: false

# automatically cancel in-progress builds if another commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# default to 0 permissions
# (job-level overrides add the minimal permissions needed)
permissions:
  contents: none

# build images from the exact commit that triggered this workflow.
#
#   * pull requests: the PR's head commit, cloned from the repo it lives in (which might be a fork)
#   * everything else: the triggering commit, cloned from this repo
#
env:
  LIGHTGBM_GIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
  LIGHTGBM_GIT_URL: >-
    ${{
      github.event.pull_request.head.repo.clone_url
      || format('https://github.com/{0}.git', github.repository)
    }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: lint dockerfiles
        run: |
          ./.ci/lint-dockerfiles.sh
  build-cpu:
    name: build (CPU)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: dockerfile-cli (build)
        run: |
          docker build \
            -t lightgbm:cli \
            --build-arg LIGHTGBM_GIT_REF="${LIGHTGBM_GIT_REF}" \
            --build-arg LIGHTGBM_GIT_URL="${LIGHTGBM_GIT_URL}" \
            - < ./docker/dockerfile-cli
      - name: dockerfile-cli (test)
        run: |
          docker run \
            --rm \
            -v "${PWD}:/LightGBM:ro" \
            -w /LightGBM/examples/binary_classification \
            lightgbm:cli \
            config=train.conf \
            num_trees=5 \
            output_model=/tmp/model.txt
      - name: dockerfile-r (build)
        run: |
          docker build \
            -t lightgbm:r \
            --build-arg LIGHTGBM_GIT_REF="${LIGHTGBM_GIT_REF}" \
            --build-arg LIGHTGBM_GIT_URL="${LIGHTGBM_GIT_URL}" \
            - < ./docker/dockerfile-r
      - name: dockerfile-r (test)
        run: |
          docker run \
            --rm \
            -v "${PWD}:/LightGBM:ro" \
            -w /tmp \
            lightgbm:r \
            Rscript /LightGBM/R-package/demo/basic_walkthrough.R
      - name: dockerfile-python (build)
        run: |
          docker build \
            -t lightgbm:python \
            --build-arg LIGHTGBM_GIT_REF="${LIGHTGBM_GIT_REF}" \
            --build-arg LIGHTGBM_GIT_URL="${LIGHTGBM_GIT_URL}" \
            - < ./docker/dockerfile-python
      - name: dockerfile-python (test)
        run: |
          docker run \
            --rm \
            -v "${PWD}:/LightGBM:ro" \
            -w /tmp \
            lightgbm:python \
            python /LightGBM/examples/python-guide/simple_example.py
  build-gpu:
    name: build (GPU)
    runs-on: ${{ inputs.test-on-gpu && 'github-hosted-linux-gpu-amd64' || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      # 'true' only when manually triggered with 'test-on-gpu', empty otherwise
      TEST_ON_GPU: ${{ inputs.test-on-gpu && 'true' || '' }}
      DEVICE: ${{ inputs.test-on-gpu && 'gpu' || 'cpu' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: dockerfile.gpu (build)
        run: |
          docker build \
            -t lightgbm:gpu \
            --build-arg LIGHTGBM_GIT_REF="${LIGHTGBM_GIT_REF}" \
            --build-arg LIGHTGBM_GIT_URL="${LIGHTGBM_GIT_URL}" \
            - < ./docker/gpu/dockerfile.gpu
      - name: dockerfile.gpu (test)
        run: |
          docker run \
            ${TEST_ON_GPU:+--gpus=all} \
            --entrypoint="" \
            --rm \
            -v "${PWD}:/LightGBM:ro" \
            -w /tmp \
            lightgbm:gpu \
            python /LightGBM/examples/python-guide/simple_example.py --device="${DEVICE}"
      - name: dockerfile-cli-only.gpu (build)
        run: |
          docker build \
            -t lightgbm:cli-only.gpu \
            --build-arg LIGHTGBM_GIT_REF="${LIGHTGBM_GIT_REF}" \
            --build-arg LIGHTGBM_GIT_URL="${LIGHTGBM_GIT_URL}" \
            - < ./docker/gpu/dockerfile-cli-only.gpu
      - name: dockerfile-cli-only.gpu (test)
        run: |
          docker run \
            ${TEST_ON_GPU:+--gpus=all} \
            --rm \
            -v "${PWD}:/LightGBM:ro" \
            -w /LightGBM/examples/binary_classification \
            lightgbm:cli-only.gpu \
            config=train.conf \
            num_trees=5 \
            device_type="${DEVICE}" \
            output_model=/tmp/model.txt
      - name: dockerfile-cli-only-distroless.gpu (build)
        run: |
          docker build \
            -t lightgbm:cli-only-distroless.gpu \
            --build-arg LIGHTGBM_GIT_REF="${LIGHTGBM_GIT_REF}" \
            --build-arg LIGHTGBM_GIT_URL="${LIGHTGBM_GIT_URL}" \
            - < ./docker/gpu/dockerfile-cli-only-distroless.gpu
      - name: dockerfile-cli-only-distroless.gpu (test)
        run: |
          docker run \
            ${TEST_ON_GPU:+--gpus=all} \
            --rm \
            -v "${PWD}:/LightGBM:ro" \
            -w /LightGBM/examples/binary_classification \
            lightgbm:cli-only-distroless.gpu \
            config=train.conf \
            num_trees=5 \
            device_type="${DEVICE}" \
            output_model=/tmp/model.txt
